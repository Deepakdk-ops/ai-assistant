[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-backend"
version = "0.1.0"
description = "Local-first RAG and agentic AI portfolio backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27,<1.0",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "langgraph>=0.2,<1.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0",
  "alembic>=1.14,<2.0",
  "celery[redis]>=5.4,<6.0",
  "redis>=5.2,<6.0"
]

[project.scripts]
ai-assistant-admin = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
